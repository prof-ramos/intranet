language: pt-BR
tone_instructions: >
  Revise em português brasileiro. Seja direto e técnico. Foque em:
  segurança (LGPD), performance SQL, e consistência com o design system.
  Evite sugerir docstrings genéricas ou refatorações cosméticas.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  path_filters:
    - "!node_modules/**"
    - "!.next/**"
    - "!drizzle/**"
    - "!*.lock"
  path_instructions:
    - path: "src/lib/db/schema/**/*.ts"
      instructions: >
        Verifique se novas tabelas possuem índices em FKs e colunas de filtro.
        Verifique se enums usam valores em português quando representam domínio de negócio.
        Confirme que timestamps usam withTimezone: true.
    - path: "src/lib/**/queries.ts"
      instructions: >
        Prefira LEFT JOIN a subqueries quando possível.
        Verifique se queries com filtros dinâmicos usam `and()` / `or()` do Drizzle corretamente.
        SQL bruto deve usar template literals do Drizzle (`sql\`...\``), nunca concatenação de strings.
    - path: "src/app/**/actions.ts"
      instructions: >
        Server Actions devem validar input antes de tocar no banco.
        Verifique se `revalidatePath` é chamado após mutações.
        Nunca exponha CPF, SIAPE, email ou dados pessoais em respostas ou logs.
    - path: "src/app/**/*.tsx"
      instructions: >
        Server Components não devem ter event handlers (onChange, onClick, etc).
        Verifique se cores usam tokens do `src/lib/ui/tokens.ts` em vez de classes DaisyUI quando possível.
    - path: "src/**/*.test.ts"
      instructions: >
        Testes devem ser determinísticos. Não use timers reais; use fake timers quando necessário.

