# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: pt-BR
tone_instructions: >
  Revise em português brasileiro. Seja direto e técnico. Foque em:
  segurança (LGPD), performance SQL, e consistência com o design system.
  Evite sugerir docstrings genéricas ou refatorações cosméticas.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  review_details: false
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true
  slop_detection:
    enabled: true
    label: ai-slop
  auto_review:
    enabled: false
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 2
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE
    labels:
      - review-ready
      - '!do-not-review'
    drafts: false
  path_filters:
    - '!node_modules/**'
    - '!.next/**'
    - '!*.lock'
    - '!coverage/**'
    - '!playwright-report/**'
    - '!test-results/**'
  path_instructions:
    - path: 'drizzle/postgres/**/*.sql'
      instructions: >
        Revise migrations PostgreSQL com foco em segurança, LGPD e reversibilidade operacional.
        Sinalize DROP/ALTER destrutivo, RLS permissivo sem justificativa, enums fora do domínio,
        índices ausentes para FKs/filtros, e SQL que exponha dados pessoais em logs ou views.
    - path: 'drizzle/postgres/meta/_journal.json'
      instructions: >
        Confirme que o journal acompanha novas migrations SQL, preserva ordem zero-padded e
        usa timestamp coerente com o arquivo de migration correspondente.
    - path: 'src/lib/db/schema/**/*.ts'
      instructions: >
        Verifique se novas tabelas possuem índices em FKs e colunas de filtro.
        Verifique se enums usam valores em português quando representam domínio de negócio.
        Confirme que timestamps usam withTimezone: true.
    - path: 'src/lib/**/queries.ts'
      instructions: >
        Prefira LEFT JOIN a subqueries quando possível.
        Verifique se queries com filtros dinâmicos usam `and()` / `or()` do Drizzle corretamente.
        SQL bruto deve usar template literals do Drizzle (`sql\`...\``), nunca concatenação de strings.
    - path: 'src/app/**/actions.ts'
      instructions: >
        Server Actions devem validar input antes de tocar no banco.
        Verifique se `revalidatePath` é chamado após mutações.
        Nunca exponha CPF, SIAPE, email ou dados pessoais em respostas ou logs.
    - path: 'src/app/api/**/route.ts'
      instructions: >
        Confirme autenticação/autorização, validação de entrada e respostas genéricas.
        Rotas cron e webhooks devem validar segredo ou assinatura antes de qualquer efeito.
        Nunca registre payloads, tokens, cookies, CPF, SIAPE, email ou outros dados pessoais.
    - path: 'src/lib/auth/**/*.ts'
      instructions: >
        Revise limites de confiança, autorização por role, expiração/rotação de sessão e
        comparação segura de segredos. Falhas de autenticação devem ser genéricas e não podem
        criar sessão nem revelar se uma conta existe.
    - path: 'src/proxy.ts'
      instructions: >
        Confirme que todas as rotas protegidas continuam cobertas e que cookies inválidos,
        ausentes ou expirados nunca liberam acesso. Evite redirects abertos.
    - path: 'src/app/**/*.tsx'
      instructions: >
        Server Components não devem ter event handlers (onChange, onClick, etc).
        Verifique se cores usam tokens do `src/lib/ui/tokens.ts` em vez de classes DaisyUI quando possível.
    - path: 'src/**/*.{test,integration.test}.{ts,tsx}'
      instructions: >
        Testes devem ser determinísticos. Não use timers reais; use fake timers quando necessário.
    - path: '.github/workflows/**/*.{yml,yaml}'
      instructions: >
        Exija actions fixadas por SHA imutável, permissions mínimas, persist-credentials: false
        quando o job não publica e proteção contra injeção de contextos não confiáveis em shell.
        Sinalize segredos em argumentos, logs ou artefatos e gatilhos com privilégios excessivos.

