  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false

  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: off
    title:
      mode: warning
      requirements: >
        Título deve ser conciso (idealmente < 70 caracteres) e descrever a mudança em português.
    description:
      mode: off
    issue_assessment:
      mode: warning
    custom_checks:
      - name: Contrato de banco sincronizado
        mode: warning
        instructions: >
          Se o PR altera schema Drizzle ou migrations PostgreSQL, passe somente quando journal,
          contrato de schema e documentação operacional afetada também estiverem sincronizados,
          ou quando o diff demonstrar objetivamente que cada item não se aplica. Se o PR não
          altera banco, marque como não aplicável.
      - name: Limites de confiança preservados
        mode: warning
        instructions: >
          Passe somente se mudanças em autenticação, Server Actions, rotas HTTP, webhooks, cron,
          logs ou auditoria preservarem autorização, validação de entrada e sigilo de tokens,
          cookies e dados pessoais. Se o PR não toca esses limites, marque como não aplicável.

chat:
  art: false
  allow_non_org_members: false
  auto_reply: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - 'DESIGN.md'
      - 'CONTEXT.md'
      - 'DATABASE.md'
      - files: 'docs/environments.md'
        applyTo: '**/*'
  learnings:
    scope: local
    approval_delay: 7
  issues:
    scope: local
  pull_requests:
    scope: local
  mcp:
    usage: disabled
  automatic_repository_linking: false
