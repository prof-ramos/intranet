name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Required variables for build-time validation in src/lib/env.ts
          SESSION_SECRET: 'ci-dummy-secret-at-least-32-chars-long'
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
          NODE_ENV: production
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}

  database-contract:
    name: Database Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asof_intranet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asof_intranet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/asof_intranet
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/asof_intranet
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: node node_modules/drizzle-kit/bin.cjs migrate

      - name: Write test database env file
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DATABASE_MIGRATION_URL=$DATABASE_MIGRATION_URL"
          } > .env.local

      - name: Run database contract tests
        run: npm run test:db

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asof_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asof_test
      ENCRYPTION_MASTER_KEY: e2e-encryption-master-key-at-least-32-chars
      SESSION_SECRET: e2e-session-secret-at-least-32-characters-long
      SKIP_AUTH: false
      # Real Supabase credentials for E2E auth user creation.
      # These GitHub secrets must be configured in repo Settings > Secrets.
      NEXT_PUBLIC_DATABASE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_DATABASE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      DATABASE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
