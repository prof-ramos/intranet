name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Required variables for build-time validation in src/lib/env.ts
          SESSION_SECRET: 'ci-dummy-secret-at-least-32-chars-long'
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
          NODE_ENV: production
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}

  database-contract:
    name: Database Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asof_intranet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asof_intranet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/asof_intranet
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/asof_intranet
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: node node_modules/drizzle-kit/bin.cjs migrate

      - name: Write test database env file
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DATABASE_MIGRATION_URL=$DATABASE_MIGRATION_URL"
          } > .env.local
          cp .env.local .env.test.local

      - name: Run database contract tests
        run: npm run test:db

      - name: Run DML integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/asof_intranet
          SESSION_SECRET: test-secret-32-chars-minimum-here
          ENCRYPTION_MASTER_KEY: test-encryption-master-key-at-least-32-chars

  smoke-prod:
    name: Smoke Test — Production
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    timeout-minutes: 10
    env:
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_BASE_URL: https://intranet.asof.com.br
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify smoke credentials
        id: verify
        run: |
          if [ -z "$SMOKE_ADMIN_EMAIL" ] || [ -z "$SMOKE_ADMIN_PASSWORD" ]; then
            echo "::error::SMOKE_ADMIN_EMAIL e/ou SMOKE_ADMIN_PASSWORD não configurados como secrets. Smoke test abortado."
            exit 1
          fi

      - name: Run smoke test
        run: npm run smoke:prod

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asof_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asof_test
      ENCRYPTION_MASTER_KEY: e2e-encryption-master-key-at-least-32-chars
      SESSION_SECRET: e2e-session-secret-at-least-32-characters-long
      SKIP_AUTH: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
