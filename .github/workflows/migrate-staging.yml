name: Migrate Staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite MIGRATE-STAGING para confirmar'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Migrations to Staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.event.inputs.confirm == 'MIGRATE-STAGING'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DATABASE_MIGRATION_ENV: staging
          ALLOW_STAGING_MIGRATIONS: 'true'
          DATABASE_STAGING_HOST: ${{ vars.DATABASE_STAGING_HOST }}

      - name: Verify schema alignment
        run: npm run test:db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
