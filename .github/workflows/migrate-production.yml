name: Migrate Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite MIGRATE-PRODUCTION para confirmar'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Migrations to Production
    runs-on: ubuntu-latest
    environment: Production
    if: github.event.inputs.confirm == 'MIGRATE-PRODUCTION'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Neon direct connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          URL="$(npx neonctl@latest connection-string \
            --api-key "$NEON_API_KEY" \
            --project-id "$NEON_PROJECT_ID" \
            --org-id org-red-mode-09715915 \
            --branch main \
            --pooled false)"
          echo "::add-mask::${URL}"
          PASSWORD="$(python3 -c 'from urllib.parse import urlparse, unquote; import os, sys; print(unquote(urlparse(sys.argv[1]).password or ""))' "$URL")"
          if [ -n "$PASSWORD" ]; then
            echo "::add-mask::${PASSWORD}"
          fi
          printf '%s' "$URL" > "$RUNNER_TEMP/database_migration_url"
          chmod 600 "$RUNNER_TEMP/database_migration_url"

      - name: Check duplicate identity hashes
        run: |
          set -euo pipefail
          export DATABASE_MIGRATION_URL="$(cat "$RUNNER_TEMP/database_migration_url")"
          node --import tsx scripts/check-associate-identity-duplicates.ts

      - name: Apply migrations
        run: |
          set -euo pipefail
          export DATABASE_MIGRATION_URL="$(cat "$RUNNER_TEMP/database_migration_url")"
          export ALLOW_PRODUCTION_MIGRATIONS=true
          node --import tsx scripts/guarded-migrate.ts
